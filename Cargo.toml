[workspace]
resolver = "2"
members = [
    "crates/aura-sample",
    "crates/aura-composition",
    "crates/aura-composer",
    "crates/aura-scheduler",
    "crates/aura-instrumentation",
    "crates/aura-imp",
    "crates/aura-dsp",
    "crates/aura-render",
    "crates/aura-io-wav",
    "crates/aura-io-cpal",
    "crates/aura-demo",
    "crates/aura-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/silentorb/aura"

[workspace.dependencies]
imp_core_types = { path = "/opt/imp-rust/crates/imp_core_types" }
imp_registry = { path = "/opt/imp-rust/crates/imp_registry" }
dasp_sample = "0.11"
dasp_signal = "0.11"
fundsp = "0.23"
cpal = "0.18"
thiserror = "2"
tempfile = "3"
