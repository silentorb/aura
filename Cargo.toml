[workspace]
resolver = "2"
members = [
    "crates/aura-sample",
    "crates/aura-dsp",
    "crates/aura-render",
    "crates/aura-io-wav",
    "crates/aura-io-cpal",
    "crates/aura-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/silentorb/aura"

[workspace.dependencies]
dasp_sample = "0.11"
dasp_signal = "0.11"
fundsp = "0.23"
cpal = "0.18"
thiserror = "2"
tempfile = "3"
